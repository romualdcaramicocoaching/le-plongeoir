name: Génération automatique d'articles

on:
  schedule:
    - cron: "5 2 * * *"   # Tous les jours à 02:05 UTC
  workflow_dispatch: {}    # Lancer à la main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Générer des articles
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTS_PER_RUN: ${{ secrets.POSTS_PER_RUN }}
        run: |
          python scripts/generate_content.py

      - name: Commit et push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate content"
            git push
          else
            echo "No changes to commit"
